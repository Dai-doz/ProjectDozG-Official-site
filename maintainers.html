<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The people behind ProjectDozG.">
    <title>Maintainers — ProjectDozG</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
    <noscript><style>.reveal { opacity: 1; }</style></noscript>
</head>
<body>

    <div class="space" aria-hidden="true">
        <canvas id="space"></canvas>
    </div>

    <header>
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="" class="logo-img" width="40" height="40">
            <span>ProjectDozG</span>
        </a>
        <div class="header-end">
            <nav aria-label="Main">
                <a href="index.html">Home</a>
                <a href="screenshots.html">Screenshots</a>
                <a href="devices.html">Devices</a>
                <a href="guide.html">Guide</a>
                <a href="wiki.html">Wiki</a>
                <a href="maintainers.html" class="active" aria-current="page">Maintainers</a>
            </nav>
            <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
                <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
        </div>
    </header>

    <main>
        <section id="maintainers">
            <h2 class="section-title reveal">Maintainers</h2>
            <p class="section-desc reveal">The people keeping ProjectDozG alive for your device.</p>
            <!-- Profile pictures: assets/avatars/ (a letter avatar shows if a file is missing) -->
            <div class="info-grid">
                <article class="info-card maintainer-card reveal">
                    <img class="avatar" src="assets/avatars/dai-doz.jpg" alt="Dai-doz" width="64" height="64" loading="lazy" decoding="async">
                    <div class="info-value">Dai-doz</div>
                    <div class="role">Lead Developer · Galaxy A12s</div>
                    <a class="m-link" href="https://t.me/Daidoza" target="_blank" rel="noopener noreferrer">Telegram</a>
                </article>
                <article class="info-card maintainer-card reveal">
                    <img class="avatar" src="assets/avatars/lucasz.jpg" alt="Lucasz" width="64" height="64" loading="lazy" decoding="async">
                    <div class="info-value">Lucasz</div>
                    <div class="role">Maintainer · Galaxy A22</div>
                    <a class="m-link" href="https://t.me/lucaszthelarper" target="_blank" rel="noopener noreferrer">Telegram</a>
                </article>
                <article class="info-card maintainer-card reveal">
                    <img class="avatar" src="assets/avatars/TranPhuong.jpg" alt="Tran Phuong" width="64" height="64" loading="lazy" decoding="async">
                    <div class="info-value">Tran Phuong</div>
                    <div class="role">Banner · Helper</div>
                    <a class="m-link" href="https://t.me/luuphuongtran" target="_blank" rel="noopener noreferrer">Telegram</a>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 ProjectDozG. All rights reserved.</p>
    </footer>

    <script src="script.js" defer></script>
    <script src="space.js" defer></script>
</body>
</html>
