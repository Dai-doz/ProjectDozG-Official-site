<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Screenshots of every ProjectDozG version.">
    <title>Screenshots — ProjectDozG</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
    <noscript><style>.reveal { opacity: 1; }</style></noscript>
</head>
<body>

    <div class="space" aria-hidden="true">
        <canvas id="space"></canvas>
    </div>

    <header>
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="" class="logo-img" width="40" height="40">
            <span>ProjectDozG</span>
        </a>
        <div class="header-end">
            <nav aria-label="Main">
                <a href="index.html">Home</a>
                <a href="screenshots.html" class="active" aria-current="page">Screenshots</a>
                <a href="devices.html">Devices</a>
                <a href="guide.html">Guide</a>
                <a href="wiki.html">Wiki</a>
                <a href="maintainers.html">Maintainers</a>
            </nav>
            <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
                <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
        </div>
    </header>

    <main>
        <section id="screenshots">
            <h2 class="section-title reveal">Screenshots</h2>
            <p class="section-desc reveal">Pick a version to see how it looks. Tap a screenshot to enlarge it.</p>

            <div class="tabs reveal" id="versionTabs" role="tablist" aria-label="ROM version"></div>
            <p class="tab-note" id="versionNote" hidden></p>

            <!-- Filled by screenshots.js. Images go in images/screenshots/<version>/1 ... 4 -->
            <div class="shots-grid" id="shotsGrid"></div>
        </section>

        <div class="lightbox" id="lightbox" role="dialog" aria-label="Screenshot preview">
            <img id="lightboxImg" alt="">
        </div>
    </main>

    <footer>
        <p>© 2026 ProjectDozG. All rights reserved.</p>
    </footer>

    <script src="script.js" defer></script>
    <script src="space.js" defer></script>
    <script src="screenshots.js" defer></script>
</body>
</html>
