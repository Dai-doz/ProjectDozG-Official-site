<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshots — ProjectDozG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header>
         <a href="index.html" class="logo">
    <img src="assets/logo.png" alt="ProjectDozG logo" class="logo-img">
    <span>ProjectDozG</span>
</a>
        <div style="display: flex; align-items: center;">
            <nav>
                <a href="index.html">Home</a>
                <a href="screenshots.html">Screenshots</a>
                <a href="devices.html">Devices</a>
                <a href="guide.html">Guide</a>
                <a href="wiki.html">Wiki</a>
                <a href="maintainers.html">Maintainers</a>
            </nav>
            <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">
                <!-- Theme toggle icons dynamically injected -->
                <svg id="themeIcon"></svg>
            </button>
        </div>
    </header>

    

    <main>
    <section id="screenshots">
        <h2 class="section-title reveal">Screenshots</h2>
        <p class="section-desc reveal">Pick a version to see how it looks. Tap a screenshot to enlarge it.</p>

        <div class="version-tabs reveal" id="versionTabs" role="tablist" aria-label="ROM version"></div>
        <p class="version-note" id="versionNote"></p>

        <!--
            HOW TO ADD SCREENSHOTS
            Put images in these folders (png, jpg or webp are all fine):
              screenshots/beta-v3.1/1 ... 4
              screenshots/v3.5.3/1 ... 4
              screenshots/v4.0/1 ... 4
            e.g. screenshots/v4.0/1.png. Missing images show a placeholder.
            To add a version later, add one line to VERSIONS below.
        -->
        <div class="shots-grid" id="shotsGrid"></div>
    </section>

    <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="Screenshot preview"></div>

    <script>
        const VERSIONS = [
            { id: 'beta-v3.1', label: 'Beta V3.1',  folder: 'screenshots/beta-v3.1', note: 'Beta build' },
            { id: 'v3.5.3',    label: 'V3.5.3',     folder: 'screenshots/v3.5.3',    note: '' },
            { id: 'v4.1',      label: 'V4.1',       folder: 'screenshots/v4.1',      note: '' }
        ];
        const SLOTS = 4;
        const EXTS = ['png', 'jpg', 'webp'];
        const PLACEHOLDER = '<div class="shot-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>Screenshot SLOT_N</div>';

        const tabs = document.getElementById('versionTabs');
        const grid = document.getElementById('shotsGrid');
        const note = document.getElementById('versionNote');

        function loadSlot(slot, folder, n) {
            slot.innerHTML = PLACEHOLDER.replace('SLOT_N', n);
            let i = 0;
            const probe = new Image();
            probe.onload = () => {
                slot.innerHTML = '';
                probe.alt = 'Screenshot ' + n;
                slot.appendChild(probe);
            };
            probe.onerror = () => {
                i++;
                if (i < EXTS.length) probe.src = folder + '/' + n + '.' + EXTS[i];
            };
            probe.src = folder + '/' + n + '.' + EXTS[0];
        }

        function showVersion(id) {
            const v = VERSIONS.find(x => x.id === id) || VERSIONS[VERSIONS.length - 1];
            tabs.querySelectorAll('.version-tab').forEach(b => {
                const on = b.dataset.id === v.id;
                b.classList.toggle('active', on);
                b.setAttribute('aria-selected', on);
            });
            note.textContent = v.note;
            note.style.display = v.note ? '' : 'none';
            grid.innerHTML = '';
            for (let n = 1; n <= SLOTS; n++) {
                const slot = document.createElement('div');
                slot.className = 'shot-slot';
                grid.appendChild(slot);
                loadSlot(slot, v.folder, n);
            }
            try { history.replaceState(null, '', '#' + v.id); } catch (e) {}
        }

        VERSIONS.forEach(v => {
            const b = document.createElement('button');
            b.className = 'version-tab';
            b.type = 'button';
            b.dataset.id = v.id;
            b.setAttribute('role', 'tab');
            b.textContent = v.label;
            b.addEventListener('click', () => showVersion(v.id));
            tabs.appendChild(b);
        });

        showVersion(location.hash.slice(1) || VERSIONS[VERSIONS.length - 1].id);
    </script>

    
    </main>

    <footer>
        <p>© 2026 ProjectDozG. All rights reserved.</p>
    </footer>

    

    <script src="script.js"></script>
</body>
</html>
